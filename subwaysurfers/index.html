<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyber Surfers 3D - Ultra Edition</title>
  <style>
    * { box-sizing: border-box; user-select: none; }
    body {
      margin: 0;
      overflow: hidden;
      background: #050510;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    #hud {
      position: absolute;
      top: 24px;
      left: 28px;
      right: 28px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      z-index: 10;
    }
    .hud-card {
      background: rgba(10, 14, 30, 0.72);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #f8fafc;
      padding: 12px 22px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: 0.8px;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.2);
      display: flex;
      gap: 18px;
      align-items: center;
    }
    .coin-badge {
      color: #fde047;
      border-color: rgba(250, 204, 21, 0.45);
      box-shadow: 0 0 25px rgba(250, 204, 21, 0.25);
    }
    #overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(15, 23, 42, 0.78) 0%, rgba(3, 7, 18, 0.94) 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      z-index: 20;
      text-align: center;
      padding: 20px;
    }
    h1 {
      font-size: 3.6rem;
      margin: 0 0 8px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 3px;
      background: linear-gradient(90deg, #38bdf8, #a855f7, #f43f5e, #facc15);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 20px rgba(168, 85, 247, 0.4));
    }
    p { color: #94a3b8; margin: 6px 0; font-size: 1.1rem; }
    .controls {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 16px 28px;
      margin: 22px 0;
      font-size: 0.95rem;
      line-height: 1.8;
      color: #e2e8f0;
    }
    .key {
      display: inline-block;
      background: rgba(56, 189, 248, 0.18);
      border: 1px solid rgba(56, 189, 248, 0.5);
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 700;
      color: #38bdf8;
      margin: 0 2px;
    }
    button {
      margin-top: 12px;
      padding: 15px 44px;
      font-size: 1.2rem;
      font-weight: 900;
      letter-spacing: 1px;
      color: #020617;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.5);
    }
    button:hover:not(:disabled) {
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 0 40px rgba(56, 189, 248, 0.8);
    }
    button:disabled {
      opacity: 0.5;
      cursor: wait;
    }
  </style>

  <!-- Three.js r160 + Addons Import Map -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="hud">
    <div class="hud-card">
      <div>SCORE: <span id="score">0</span></div>
      <div style="opacity:0.4">|</div>
      <div>BEST: <span id="best">0</span></div>
    </div>
    <div class="hud-card coin-badge">
      COINS: <span id="coins">0</span>
    </div>
  </div>

  <div id="overlay">
    <h1 id="title">Cyber Surfers 3D</h1>
    <p id="subtitle">Loading rigged 3D character & shaders...</p>
    <div class="controls">
      <div><span class="key">A</span> <span class="key">D</span> or <span class="key">&larr;</span> <span class="key">&rarr;</span> Switch Lanes</div>
      <div><span class="key">W</span> <span class="key">SPACE</span> or <span class="key">&uarr;</span> Jump Hurdles &amp; Climb Low Barriers</div>
      <div><span class="key">S</span> or <span class="key">&darr;</span> Slide / Fast-Drop Under Laser Gates</div>
    </div>
    <button id="startBtn" disabled>LOADING 3D ASSETS...</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    // --- SCENE & RENDERER ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x060814);
    scene.fog = new THREE.FogExp2(0x060814, 0.011);

    const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.1, 180);
    camera.position.set(0, 6.2, 11.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    document.body.appendChild(renderer.domElement);

    // --- POST-PROCESSING (UNREAL BLOOM) ---
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.85, // strength
      0.4,  // radius
      0.75  // threshold
    );
    composer.addPass(bloomPass);

    // --- LIGHTING ---
    const hemiLight = new THREE.HemisphereLight(0x60a5fa, 0x1e1b4b, 1.1);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xf8fafc, 1.8);
    dirLight.position.set(18, 35, 22);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(2048, 2048);
    dirLight.shadow.camera.near = 1;
    dirLight.shadow.camera.far = 120;
    dirLight.shadow.camera.left = -20;
    dirLight.shadow.camera.right = 20;
    dirLight.shadow.camera.top = 30;
    dirLight.shadow.camera.bottom = -30;
    scene.add(dirLight);

    // --- GAME CONSTANTS & STATE ---
    const LANES = [-3.4, 0, 3.4];
    let currentLane = 1;
    let isRunning = false;
    let score = 0;
    let coins = 0;
    let bestScore = parseInt(localStorage.getItem('cyber_surfer_best') || '0', 10);
    document.getElementById('best').innerText = bestScore;

    let speed = 26; // units per second
    let velocityY = 0;
    const gravity = -52;
    let isJumping = false;
    let isRolling = false;
    let rollTimer = 0;
    let shakeIntensity = 0;

    // --- ENVIRONMENT: TRACKS, SLEEPERS, NEON ARCHES & CITY ---
    const trackGroup = new THREE.Group();
    scene.add(trackGroup);

    const groundMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.9, metalness: 0.1 });
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(24, 300), groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.z = -120;
    ground.receiveShadow = true;
    scene.add(ground);

    // Glowing Side Neon Strips
    [-6.2, 6.2].forEach(xPos => {
      const strip = new THREE.Mesh(
        new THREE.BoxGeometry(0.18, 0.2, 300),
        new THREE.MeshBasicMaterial({ color: 0x06b6d4 })
      );
      strip.position.set(xPos, 0.1, -120);
      scene.add(strip);
    });

    // Metallic Rails
    const railMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.85, roughness: 0.2 });
    LANES.forEach(laneX => {
      [-0.85, 0.85].forEach(offset => {
        const rail = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.22, 300), railMat);
        rail.position.set(laneX + offset, 0.12, -120);
        rail.receiveShadow = true;
        scene.add(rail);
      });
    });

    // Scrolling Sleepers, Neon Overhead Portals & City Buildings
    const scrollingProps = [];
    const sleeperGeo = new THREE.BoxGeometry(2.4, 0.12, 0.45);
    const sleeperMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.8 });

    // Procedural Window Texture for City Buildings
    function createBuildingMaterial() {
      const canvas = document.createElement('canvas');
      canvas.width = 64;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#090d16';
      ctx.fillRect(0, 0, 64, 128);
      for (let y = 8; y < 120; y += 14) {
        for (let x = 8; x < 56; x += 14) {
          if (Math.random() > 0.45) {
            ctx.fillStyle = Math.random() > 0.2 ? '#38bdf8' : '#f43f5e';
            ctx.fillRect(x, y, 8, 8);
          }
        }
      }
      const tex = new THREE.CanvasTexture(canvas);
      tex.magFilter = THREE.NearestFilter;
      return new THREE.MeshStandardMaterial({
        color: 0x1e293b,
        emissive: 0xffffff,
        emissiveMap: tex,
        emissiveIntensity: 0.9,
        roughness: 0.4
      });
    }

    const buildingMats = [createBuildingMaterial(), createBuildingMaterial(), createBuildingMaterial()];

    for (let z = 15; z > -165; z -= 4) {
      LANES.forEach(laneX => {
        const s = new THREE.Mesh(sleeperGeo, sleeperMat);
        s.position.set(laneX, 0.05, z);
        s.receiveShadow = true;
        scene.add(s);
        scrollingProps.push({ mesh: s, wrap: 180 });
      });

      // Overhead Neon Arches & Buildings every 20 units
      if (Math.abs(z) % 20 === 0) {
        const archGroup = new THREE.Group();
        const pillarGeo = new THREE.BoxGeometry(0.4, 9, 0.4);
        const pillarMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.7 });
        const leftP = new THREE.Mesh(pillarGeo, pillarMat);
        leftP.position.set(-6.5, 4.5, 0);
        const rightP = new THREE.Mesh(pillarGeo, pillarMat);
        rightP.position.set(6.5, 4.5, 0);
        const topBeam = new THREE.Mesh(
          new THREE.BoxGeometry(13.6, 0.35, 0.35),
          new THREE.MeshBasicMaterial({ color: 0xa855f7 })
        );
        topBeam.position.set(0, 9, 0);
        archGroup.add(leftP, rightP, topBeam);
        archGroup.position.z = z;
        scene.add(archGroup);
        scrollingProps.push({ mesh: archGroup, wrap: 180 });

        // Left & Right Skyscrapers
        [-15, 15].forEach(bx => {
          const h = 18 + Math.random() * 26;
          const b = new THREE.Mesh(
            new THREE.BoxGeometry(7, h, 7),
            buildingMats[Math.floor(Math.random() * buildingMats.length)]
          );
          b.position.set(bx + (Math.random() * 2 - 1), h / 2, z);
          scene.add(b);
          scrollingProps.push({ mesh: b, wrap: 180 });
        });
      }
    }

    // --- LOAD RIGGED 3D CHARACTER (RobotExpressive.glb) ---
    const playerPivot = new THREE.Group();
    playerPivot.position.set(0, 0, 4);
    scene.add(playerPivot);

    let mixer = null;
    const actions = {};
    let activeAction = null;

    const loader = new GLTFLoader();
    loader.load(
      'https://threejs.org/examples/models/gltf/RobotExpressive/RobotExpressive.glb',
      (gltf) => {
        const model = gltf.scene;
        model.scale.set(0.62, 0.62, 0.62);
        model.rotation.y = Math.PI; // Face forward down the tracks
        model.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
          }
        });
        playerPivot.add(model);

        mixer = new THREE.AnimationMixer(model);
        gltf.animations.forEach((clip) => {
          actions[clip.name] = mixer.clipAction(clip);
        });

        fadeToAction('Idle', 0.1);
        const btn = document.getElementById('startBtn');
        btn.disabled = false;
        btn.innerText = 'START RUN';
        document.getElementById('subtitle').innerText = 'High-speed WebGL 3D endless runner with skeletal animation & bloom';
      }
    );

    function fadeToAction(name, duration = 0.18) {
      if (!actions[name]) return;
      const nextAction = actions[name];
      if (activeAction !== nextAction) {
        if (activeAction) activeAction.fadeOut(duration);
        nextAction.reset().setEffectiveTimeScale(1).setEffectiveWeight(1).fadeIn(duration).play();
        activeAction = nextAction;
      }
    }

    // --- DETAILED PREFAB BUILDERS (TRAINS, BARRIERS, COINS, PARTICLES) ---
    let obstacles = [];
    let coinItems = [];
    let particles = [];
    let spawnDistance = 0;

    function buildDetailedTrain() {
      const train = new THREE.Group();

      // Main Carriage Body
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0xe11d48, metalness: 0.5, roughness: 0.25 });
      const body = new THREE.Mesh(new THREE.BoxGeometry(2.65, 3.4, 13.5), bodyMat);
      body.position.y = 2.0;
      body.castShadow = true;
      body.receiveShadow = true;
      train.add(body);

      // Metallic Roof
      const roof = new THREE.Mesh(
        new THREE.BoxGeometry(2.4, 0.3, 13.2),
        new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.8, roughness: 0.2 })
      );
      roof.position.y = 3.85;
      train.add(roof);

      // Dark Undercarriage Chassis
      const base = new THREE.Mesh(
        new THREE.BoxGeometry(2.5, 0.5, 13.4),
        new THREE.MeshStandardMaterial({ color: 0x0f172a })
      );
      base.position.y = 0.35;
      train.add(base);

      // Glowing Neon Cyan Side Stripes
      const stripeMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
      const stripe = new THREE.Mesh(new THREE.BoxGeometry(2.7, 0.22, 13.52), stripeMat);
      stripe.position.y = 1.65;
      train.add(stripe);

      // Glowing Front Windshield
      const glass = new THREE.Mesh(
        new THREE.BoxGeometry(2.1, 0.95, 0.1),
        new THREE.MeshBasicMaterial({ color: 0x7dd3fc })
      );
      glass.position.set(0, 2.75, 6.76);
      train.add(glass);

      // Twin High-Beam Headlights (Triggers Bloom)
      const lightMat = new THREE.MeshBasicMaterial({ color: 0xfef08a });
      [-0.85, 0.85].forEach(lx => {
        const hl = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.12, 16), lightMat);
        hl.rotation.x = Math.PI / 2;
        hl.position.set(lx, 1.15, 6.76);
        train.add(hl);
      });

      return train;
    }

    function buildLowHurdle() {
      const group = new THREE.Group();
      const postMat = new THREE.MeshStandardMaterial({ color: 0x475569, metalness: 0.7 });
      [-1.1, 1.1].forEach(px => {
        const post = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 1.25), postMat);
        post.position.set(px, 0.62, 0);
        group.add(post);
      });
      const bar = new THREE.Mesh(
        new THREE.BoxGeometry(2.5, 0.45, 0.3),
        new THREE.MeshStandardMaterial({ color: 0xf97316, emissive: 0xea580c, emissiveIntensity: 0.4 })
      );
      bar.position.y = 0.95;
      bar.castShadow = true;
      group.add(bar);
      return group;
    }

    function buildHighLaserGate() {
      const group = new THREE.Group();
      const postMat = new THREE.MeshStandardMaterial({ color: 0x475569, metalness: 0.8 });
      [-1.2, 1.2].forEach(px => {
        const post = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 3.6), postMat);
        post.position.set(px, 1.8, 0);
        group.add(post);
      });
      // Glowing Laser Barrier Overhead
      const laser = new THREE.Mesh(
        new THREE.BoxGeometry(2.5, 1.5, 0.28),
        new THREE.MeshBasicMaterial({ color: 0xd946ef })
      );
      laser.position.y = 2.65;
      group.add(laser);
      return group;
    }

    function spawnBurstParticles(pos, colorHex, count = 18) {
      const geo = new THREE.BoxGeometry(0.22, 0.22, 0.22);
      const mat = new THREE.MeshBasicMaterial({ color: colorHex });
      for (let i = 0; i < count; i++) {
        const p = new THREE.Mesh(geo, mat);
        p.position.copy(pos);
        const vel = new THREE.Vector3(
          (Math.random() - 0.5) * 14,
          Math.random() * 12 + 2,
          (Math.random() - 0.5) * 14
        );
        scene.add(p);
        particles.push({ mesh: p, vel, life: 0.55 });
      }
    }

    function spawnRow() {
      const usedLanes = new Set();
      const obstacleCount = Math.random() > 0.45 ? 2 : 1;
      const z = -135;

      for (let i = 0; i < obstacleCount; i++) {
        let lane = Math.floor(Math.random() * 3);
        while (usedLanes.has(lane)) lane = (lane + 1) % 3;
        usedLanes.add(lane);

        const x = LANES[lane];
        const r = Math.random();

        if (r < 0.44) {
          const train = buildDetailedTrain();
          train.position.set(x, 0, z);
          scene.add(train);
          obstacles.push({ mesh: train, type: 'train', moving: Math.random() > 0.35 });
        } else if (r < 0.74) {
          const low = buildLowHurdle();
          low.position.set(x, 0, z);
          scene.add(low);
          obstacles.push({ mesh: low, type: 'low', moving: false });
        } else {
          const high = buildHighLaserGate();
          high.position.set(x, 0, z);
          scene.add(high);
          obstacles.push({ mesh: high, type: 'high', moving: false });
        }
      }

      // Spawn glowing Torus coins in an open lane
      const freeLanes = [0, 1, 2].filter(l => !usedLanes.has(l));
      const coinLane = freeLanes[Math.floor(Math.random() * freeLanes.length)];
      const coinGeo = new THREE.TorusGeometry(0.42, 0.13, 12, 24);
      const coinMat = new THREE.MeshStandardMaterial({
        color: 0xfacc15,
        emissive: 0xeab308,
        emissiveIntensity: 0.75,
        metalness: 0.9,
        roughness: 0.1
      });

      for (let c = 0; c < 5; c++) {
        const coin = new THREE.Mesh(coinGeo, coinMat);
        coin.position.set(LANES[coinLane], 1.3, z - c * 3.4);
        scene.add(coin);
        coinItems.push(coin);
      }
    }

    // --- PLAYER CONTROLS ---
    function moveLeft() {
      if (currentLane > 0) currentLane--;
    }
    function moveRight() {
      if (currentLane < 2) currentLane++;
    }
    function jump() {
      if (!isJumping) {
        velocityY = 18.5;
        isJumping = true;
        isRolling = false;
        playerPivot.scale.y = 1;
        fadeToAction('Jump', 0.1);
      }
    }
    function roll() {
      if (isJumping) velocityY = -28; // Slam down quickly
      isRolling = true;
      rollTimer = 0.55;
      playerPivot.scale.y = 0.45;
    }

    window.addEventListener('keydown', (e) => {
      if (!isRunning) return;
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') moveLeft();
      if (e.code === 'ArrowRight' || e.code === 'KeyD') moveRight();
      if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') jump();
      if (e.code === 'ArrowDown' || e.code === 'KeyS') roll();
    });

    // Touch Swipes
    let touchX = 0, touchY = 0;
    window.addEventListener('touchstart', e => {
      touchX = e.changedTouches[0].screenX;
      touchY = e.changedTouches[0].screenY;
    });
    window.addEventListener('touchend', e => {
      if (!isRunning) return;
      const dx = e.changedTouches[0].screenX - touchX;
      const dy = e.changedTouches[0].screenY - touchY;
      if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 30) moveRight();
        else if (dx < -30) moveLeft();
      } else {
        if (dy < -30) jump();
        else if (dy > 30) roll();
      }
    });

    // --- START & GAME OVER ---
    function startGame() {
      obstacles.forEach(o => scene.remove(o.mesh));
      coinItems.forEach(c => scene.remove(c));
      obstacles = [];
      coinItems = [];

      currentLane = 1;
      playerPivot.position.set(0, 0, 4);
      playerPivot.scale.set(1, 1, 1);
      score = 0;
      coins = 0;
      speed = 28;
      spawnDistance = 0;
      isJumping = false;
      isRolling = false;

      document.getElementById('score').innerText = '0';
      document.getElementById('coins').innerText = '0';
      document.getElementById('overlay').style.display = 'none';

      fadeToAction('Running', 0.15);
      isRunning = true;
    }

    function triggerGameOver() {
      isRunning = false;
      shakeIntensity = 0.65;
      spawnBurstParticles(playerPivot.position.clone().add(new THREE.Vector3(0, 1.5, 0)), 0xf43f5e, 32);

      if (actions['Death']) {
        actions['Death'].setLoop(THREE.LoopOnce);
        actions['Death'].clampWhenFinished = true;
        fadeToAction('Death', 0.1);
      }

      if (Math.floor(score) > bestScore) {
        bestScore = Math.floor(score);
        localStorage.setItem('cyber_surfer_best', bestScore);
        document.getElementById('best').innerText = bestScore;
      }

      setTimeout(() => {
        document.getElementById('title').innerText = 'WIPEOUT!';
        document.getElementById('subtitle').innerText = `Final Score: ${Math.floor(score)}  |  Coins Collected: ${coins}`;
        document.getElementById('startBtn').innerText = 'RUN AGAIN';
        document.getElementById('overlay').style.display = 'flex';
      }, 650);
    }

    document.getElementById('startBtn').addEventListener('click', startGame);

    // --- MAIN ANIMATION LOOP ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.1);

      if (mixer) mixer.update(dt);

      // Update Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.mesh.position.addScaledVector(p.vel, dt);
        p.vel.y -= 28 * dt;
        p.life -= dt;
        p.mesh.scale.setScalar(Math.max(0, p.life * 2));
        if (p.life <= 0) {
          scene.remove(p.mesh);
          particles.splice(i, 1);
        }
      }

      // Camera Shake Decay
      if (shakeIntensity > 0) {
        camera.position.x += (Math.random() - 0.5) * shakeIntensity;
        camera.position.y = 6.2 + (Math.random() - 0.5) * shakeIntensity;
        shakeIntensity = Math.max(0, shakeIntensity - dt * 2.2);
      }

      if (isRunning) {
        speed = Math.min(58, speed + dt * 0.55); // Smooth speed ramp
        score += speed * dt * 0.8;
        document.getElementById('score').innerText = Math.floor(score);

        // Dynamic Camera Follow & FOV Warp
        const targetX = LANES[currentLane];
        playerPivot.position.x = THREE.MathUtils.lerp(playerPivot.position.x, targetX, dt * 14);
        playerPivot.rotation.z = (playerPivot.position.x - targetX) * 0.08;

        camera.position.x = THREE.MathUtils.lerp(camera.position.x, playerPivot.position.x * 0.45, dt * 8);
        camera.fov = THREE.MathUtils.lerp(camera.fov, 62 + (speed - 28) * 0.35, dt * 4);
        camera.updateProjectionMatrix();
        camera.lookAt(playerPivot.position.x * 0.25, 2.2, -12);

        // Jump Physics
        if (isJumping) {
          playerPivot.position.y += velocityY * dt;
          velocityY += gravity * dt;
          if (playerPivot.position.y <= 0) {
            playerPivot.position.y = 0;
            isJumping = false;
            velocityY = 0;
            if (!isRolling) fadeToAction('Running', 0.12);
          }
        }

        // Slide / Roll Timer
        if (isRolling) {
          rollTimer -= dt;
          if (rollTimer <= 0) {
            isRolling = false;
            playerPivot.scale.y = 1;
            if (!isJumping) fadeToAction('Running', 0.12);
          }
        }

        // Scroll Track & City Props
        scrollingProps.forEach(item => {
          item.mesh.position.z += speed * dt;
          if (item.mesh.position.z > 20) item.mesh.position.z -= item.wrap;
        });

        // Spawn New Obstacle Waves
        spawnDistance += speed * dt;
        if (spawnDistance > 26) {
          spawnRow();
          spawnDistance = 0;
        }

        // Move Obstacles & Detect Collisions
        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obs = obstacles[i];
          const moveSpeed = obs.moving ? speed * 1.38 : speed;
          obs.mesh.position.z += moveSpeed * dt;

          const dz = Math.abs(obs.mesh.position.z - playerPivot.position.z);
          const dx = Math.abs(obs.mesh.position.x - playerPivot.position.x);
          const hitZ = obs.type === 'train' ? 6.8 : 0.75;

          if (dz < hitZ && dx < 1.15) {
            if (obs.type === 'train') {
              triggerGameOver();
              break;
            } else if (obs.type === 'low' && playerPivot.position.y < 1.15) {
              triggerGameOver();
              break;
            } else if (obs.type === 'high' && !isRolling) {
              triggerGameOver();
              break;
            }
          }

          if (obs.mesh.position.z > 22) {
            scene.remove(obs.mesh);
            obstacles.splice(i, 1);
          }
        }

        // Move Coins & Collect
        for (let i = coinItems.length - 1; i >= 0; i--) {
          const c = coinItems[i];
          c.position.z += speed * dt;
          c.rotation.y += 3.5 * dt;

          const dz = Math.abs(c.position.z - playerPivot.position.z);
          const dx = Math.abs(c.position.x - playerPivot.position.x);
          if (dz < 1.0 && dx < 1.2 && playerPivot.position.y < 2.5) {
            coins++;
            score += 25;
            document.getElementById('coins').innerText = coins;
            spawnBurstParticles(c.position, 0xfacc15, 10);
            scene.remove(c);
            coinItems.splice(i, 1);
            continue;
          }

          if (c.position.z > 18) {
            scene.remove(c);
            coinItems.splice(i, 1);
          }
        }
      }

      composer.render();
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
